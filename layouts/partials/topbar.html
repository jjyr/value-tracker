{{ $build := site.Data.stockhunt.build }}
<header class="topbar">
  <div class="topbar-primary">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="价值追踪 首页">
      <span class="brand-mark">价</span>
      <span>
        <strong>价值追踪</strong>
      </span>
    </a>
    <nav class="topbar-nav" aria-label="主导航">
      <a class="topbar-nav-button" href="{{ printf "%s#simulation" site.Home.RelPermalink }}">模拟盘</a>
      <a class="topbar-nav-button" href="{{ "intro/" | relURL }}">规则介绍</a>
      <a class="topbar-nav-button" href="{{ "institutions/" | relURL }}">追踪机构</a>
    </nav>
  </div>
  <div class="topbar-meta" aria-label="数据状态">
    <span class="status-pill status-{{ lower ($build.status | default "unknown") }}">{{ $build.status | default "--" }}</span>
    <span>数据 {{ $build.data_date | default "--" }}</span>
    <span>13F {{ $build.latest_13f_report_period | default "--" }}</span>
    <span>构建 {{ $build.built_at | default "--" }}</span>
  </div>
</header>
