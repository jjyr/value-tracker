{{ $current := float (.current | default 0) }}
{{ $basis := float (.basis | default 0) }}
{{ $caption := .caption | default "" }}
{{ if gt $basis 0.0 }}
  <div class="price-basis">
    <strong>${{ printf "%.2f" $basis }}</strong>
    {{ with $caption }}<span class="basis-caption">{{ . }}</span>{{ end }}
  </div>
{{ else }}
  <div class="price-basis">
    <strong>--</strong>
    {{ with $caption }}<span class="basis-caption">{{ . }}</span>{{ end }}
  </div>
{{ end }}
