{{ $points := .points | default (slice) }}
{{ $series := .series | default (slice) }}
{{ $range := .range | default "ytd" }}
<div class="panel chart-panel {{ .className }}">
  <div class="panel-heading compact">
    <div>
      <p class="eyebrow">{{ .eyebrow | default "Equity Curve" }}</p>
      <h2>{{ .title }}</h2>
    </div>
    <div class="segmented-control" aria-label="图表范围">
      <button class="range-button {{ if eq $range "ytd" }}is-active{{ end }}" type="button" data-range="ytd">YTD</button>
      <button class="range-button {{ if eq $range "all" }}is-active{{ end }}" type="button" data-range="all">ALL</button>
      <button class="range-button {{ if eq $range "3m" }}is-active{{ end }}" type="button" data-range="3m">3M</button>
      <button class="range-button {{ if eq $range "1m" }}is-active{{ end }}" type="button" data-range="1m">1M</button>
    </div>
  </div>
  <svg
    class="equity-chart"
    data-range="{{ $range }}"
    data-points='{{ $points | jsonify }}'
    data-series='{{ $series | jsonify }}'
    role="img"
    aria-label="{{ .ariaLabel | default .title }}"></svg>
  {{ if $series }}
    <div class="legend" aria-label="图表序列开关">
      {{ range $series }}
        <button
          class="legend-toggle is-active"
          type="button"
          data-series="{{ .key }}"
          aria-pressed="true"
          style="--legend-color: {{ .color | default "#54d690" }}">
          <i class="legend-dot"></i>{{ .label }}
        </button>
      {{ end }}
    </div>
  {{ end }}
</div>
