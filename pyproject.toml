[project]
name = "stockhunt"
version = "0.1.0"
description = "Static SEC 13F signal dashboard generator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pyyaml>=6.0.0",
]

[project.scripts]
stockhunt-build-live = "scripts.tasks:build_live"
stockhunt-build-sample = "scripts.tasks:build_sample"
stockhunt-check = "scripts.tasks:check"
stockhunt-backend = "scripts.stockhunt_backend:main"
stockhunt-backtest = "scripts.historical_backtest:main"
stockhunt-export = "scripts.generate_stockhunt_data:main"
stockhunt-live-input = "scripts.build_live_input:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
