[project]
name = "stockhunt"
version = "0.1.0"
description = "Static SEC 13F signal dashboard generator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pyyaml>=6.0.0",
]

[project.scripts]
stockhunt-build = "scripts.tasks:build"
stockhunt-fetch = "scripts.tasks:fetch"
stockhunt-fetch-all = "scripts.tasks:fetch_all"
stockhunt-schedule = "scripts.tasks:schedule"
stockhunt-check = "scripts.tasks:check"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
