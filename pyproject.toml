[project]
name = "stockhunt"
version = "0.1.0"
description = "Static SEC 13F signal dashboard generator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pyyaml>=6.0.0",
]

[project.scripts]
build = "scripts.tasks:build"
fetch = "scripts.tasks:fetch"
fetch-all = "scripts.tasks:fetch_all"
schedule = "scripts.tasks:schedule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
